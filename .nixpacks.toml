[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.bcmath",
    "php84Extensions.curl",
    "php84Extensions.exif",
    "php84Extensions.gd",
    "php84Extensions.mbstring",
    "php84Extensions.mysqli",
    "php84Extensions.pdo_mysql",
    "php84Extensions.pdo_sqlite",
    "php84Extensions.sqlite3",
    "php84Extensions.tokenizer",
    "php84Extensions.xml",
    "php84Extensions.zip",
    "php84Extensions.opcache",
    "php84Packages.composer",
    "sqlite",
    "nodejs_20",
    "npm-10_x"
]

[phases.install]
cmds = [
    "mkdir -p /app/database",
    "touch /app/database/database.sqlite",
    "composer install --ignore-platform-reqs",
    "npm ci --legacy-peer-deps || npm i --legacy-peer-deps"
]

[phases.build]
cmds = [
    "DB_CONNECTION=sqlite DB_DATABASE=:memory: composer install --no-dev --optimize-autoloader --ignore-platform-reqs",
    "DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan config:cache",
    "DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan route:cache",
    "DB_CONNECTION=sqlite DB_DATABASE=:memory: php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT}"