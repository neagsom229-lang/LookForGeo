name: Deploy and smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lookforgeo
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-smoke:
    name: Deploy then smoke
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BASE_URL: https://lookforgeo.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null -w 'deploy_hook_http=%{http_code}\n'

      - name: Deploy hook not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy hook; smoke still runs."

      - name: Wait for liveness
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/up" || true)
            echo "attempt=$i liveness_http=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "TIMEOUT: /up never returned 200"
          exit 1

      - name: Post-deploy smoke /api/health
        run: |
          body=$(curl -sS "$BASE_URL/api/health" || true)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/api/health" || true)
          status=$(printf '%s' "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
          echo "health_http=$code health_status=$status"
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "FAIL: expected JSON 200 or 503"
            exit 1
          fi
          if [ "$status" != "operational" ] && [ "$status" != "degraded" ]; then
            echo "FAIL: expected status operational or degraded"
            exit 1
          fi

      - name: Read-only production probe
        shell: pwsh
        run: ./scripts/probe-prod.ps1 -BaseUrl https://lookforgeo.onrender.com

      - name: Notify on failure (dedupe)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deploy smoke failed for ' + context.sha.substring(0, 7);
            const body = 'Deploy or post-deploy smoke failed. '
              + 'See the workflow run for details: '
              + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId + '.';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100
            });
            const existing = issues.data.find(issue =>
              issue.title.startsWith('Deploy smoke failed for ')
              && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recurred in run ' + context.runId + '.'
              });
              core.info('Updated existing issue #' + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci']
              });
              core.info('Opened issue #' + created.data.number);
            }
