name: Deploy and probe

# Runs after a merge to main (or manually). The Render deploy hook URL is a
# secret and is never printed. The only request this repository makes to the
# live site is the read-only GET-only probe script.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys/probes at once; a second push queues behind the first.
concurrency:
  group: deploy-lookforgeo
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-probe:
    name: Deploy then read-only probe
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUSHED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # No secret configured (e.g. fork or first setup): do not fail the run
      # and do not open an issue. The read-only probe below still runs.
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null -w 'deploy_hook_http=%{http_code}\n'

      - name: Deploy hook not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy hook; read-only probe still runs."

      # Max 10 minutes (60 x 10s). Keep the last observed health body and
      # HTTP code so a timeout is diagnosable from the workflow log.
      - name: Wait for deployed commit
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          wanted="${PUSHED_SHA:0:7}"
          last_body=""
          last_code=""
          for i in $(seq 1 60); do
            last_body=$(curl -sS https://lookforgeo.onrender.com/api/health || true)
            last_code=$(curl -sS -o /dev/null -w '%{http_code}' https://lookforgeo.onrender.com/api/health || true)
            commit=$(printf '%s' "$last_body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            echo "attempt=$i health_http=$last_code health_commit=$commit wanted=$wanted"
            if [ "$commit" = "$wanted" ]; then
              echo "deployed commit matched within 10 minutes"
              exit 0
            fi
            sleep 10
          done
          echo "TIMEOUT: deployed commit never matched $wanted within 10 minutes"
          echo "last_health_http=$last_code"
          echo "last_health_json=$last_body"
          exit 1

      - name: Wait for health endpoint
        run: |
          last_body=""
          last_code=""
          for i in $(seq 1 60); do
            last_body=$(curl -sS https://lookforgeo.onrender.com/api/health || true)
            last_code=$(curl -sS -o /dev/null -w '%{http_code}' https://lookforgeo.onrender.com/api/health || true)
            echo "attempt=$i health_http=$last_code"
            if [ "$last_code" = "200" ]; then
              echo "health_http=200"
              exit 0
            fi
            sleep 10
          done
          echo "TIMEOUT: health check never returned 200 within 10 minutes"
          echo "last_health_http=$last_code"
          echo "last_health_json=$last_body"
          exit 1

      - name: Run read-only production probe
        shell: pwsh
        run: ./scripts/probe-prod.ps1 -BaseUrl https://lookforgeo.onrender.com

      # Dedupe: update the existing open deploy-probe issue instead of
      # opening a new one on every failed run.
      - name: Notify on failure (dedupe)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deploy probe failed for ' + context.sha.substring(0, 7);
            const body = 'Render deploy or the read-only production probe failed. '
              + 'See the workflow run for details: '
              + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId + '.';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100
            });
            const existing = issues.data.find(issue =>
              issue.title.startsWith('Deploy probe failed for ')
              && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recurred in run ' + context.runId + '.'
              });
              core.info('Updated existing issue #' + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci']
              });
              core.info('Opened issue #' + created.data.number);
            }
