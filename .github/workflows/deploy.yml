name: Deploy and smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lookforgeo
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-smoke:
    name: Deploy then smoke
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BASE_URL: https://lookforgeo.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null -w 'deploy_hook_http=%{http_code}\n'

      - name: Deploy hook not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy hook; smoke still runs."

      - name: Wait for deployed commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          expected="${EXPECTED_SHA:0:7}"
          for i in $(seq 1 60); do
            headers=$(curl -sS -D - -o /dev/null "$BASE_URL/up" || true)
            code=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {print $2; exit}')
            commit=$(printf '%s' "$headers" | awk -F': ' 'tolower($1)=="x-app-commit" {gsub("\r","",$2); print $2; exit}')
            echo "attempt=$i up_http=${code:-unknown} commit=${commit:-none} expected=$expected"
            if [ "$code" = "200" ] && [ "$commit" = "$expected" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "TIMEOUT: deployed commit never matched $expected within 10 minutes"
          exit 1

      - name: Post-deploy smoke /api/health
        run: |
          last_code=""
          last_status=""
          for i in $(seq 1 5); do
            body=$(curl -sS "$BASE_URL/api/health" || true)
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE_URL/api/health" || true)
            status=$(printf '%s' "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
            last_code="$code"
            last_status="$status"
            echo "attempt=$i health_http=${code:-unknown} health_status=${status:-none}"
            if [ "$code" = "200" ] && [ "$status" = "operational" ]; then
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              sleep 15
            fi
          done
          echo "FAIL: /api/health did not become operational after 5 attempts (last_http=${last_code:-unknown} last_status=${last_status:-none})"
          exit 1

      - name: Read-only production probe
        shell: pwsh
        run: ./scripts/probe-prod.ps1 -BaseUrl https://lookforgeo.onrender.com

      - name: Notify on failure (dedupe)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deploy smoke failed for ' + context.sha.substring(0, 7);
            const body = 'Deploy or post-deploy smoke failed. '
              + 'See the workflow run for details: '
              + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
              + '/actions/runs/' + context.runId + '.';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 100
            });
            const existing = issues.data.find(issue =>
              issue.title.startsWith('Deploy smoke failed for ')
              && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recurred in run ' + context.runId + '.'
              });
              core.info('Updated existing issue #' + existing.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci']
              });
              core.info('Opened issue #' + created.data.number);
            }
