name: Tests

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      # Dev dependencies ARE required here: `composer test` runs phpunit,
      # which lives in require-dev. A --no-dev install removes phpunit and
      # the job would fail with "phpunit: command not found".
      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Run tests
        run: composer test

  smoke:
    name: Smoke test (offline, fake Gemini)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell parse check
        shell: pwsh
        run: ./scripts/Lint.ps1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      # `php artisan test` also needs phpunit from require-dev.
      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Run E2E smoke test
        run: php artisan test --filter=SmokeTest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json & composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Security audit
        run: composer audit

  pint:
    name: Pint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Pint --test changed files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- app routes config database tests)
          if [ -z "$CHANGED" ]; then
            echo "No PHP files changed — nothing to check."
            exit 0
          fi
          echo "Checking: $CHANGED"
          vendor/bin/pint --test $CHANGED
