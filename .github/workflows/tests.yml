name: Tests

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:

jobs:
  js:
    name: JS checks (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # composer js:check runs `node --check` and `node --test`; without an
      # explicit setup-node step the runner's Node version is undefined.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Node syntax + unit tests
        run: composer js:check

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      # Dev dependencies ARE required here: `composer test` runs phpunit,
      # which lives in require-dev. A --no-dev install removes phpunit and
      # the job would fail with "phpunit: command not found".
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Run tests (fast + slow process group)
        run: composer test:all

  gd-matrix:
    name: GD matrix (${{ matrix.gd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gd: [with-jpeg, without-jpeg]
    steps:
      - uses: actions/checkout@v4

      # Rebuild GD explicitly so one leg has imagecreatefromjpeg() and the
      # other does not. Tests force the encoder path via config, so both
      # legs must produce identical results.
      - name: Build PHP image (${{ matrix.gd }})
        run: |
          WITH_JPEG=1
          [ "${{ matrix.gd }}" = "without-jpeg" ] && WITH_JPEG=0
          docker build -f docker/Dockerfile.gd-matrix \
            --build-arg WITH_JPEG="$WITH_JPEG" -t tracegeo-gd:${{ matrix.gd }} .

      - name: Run full suite
        run: |
          docker run --rm -v "$PWD:/work" -w /work tracegeo-gd:${{ matrix.gd }} \
            sh -c 'composer install --optimize-autoloader --no-interaction && composer test:all'

  decoy-env:
    name: Hermetic suite with decoy .env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      # A temp worktree gets a .env with contradicting dummy values;
      # phpunit.xml force="true" must make them irrelevant.
      - name: Full suite with decoy .env
        run: composer test:decoy

  smoke:
    name: Smoke test (offline, fake Gemini)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell parse check
        shell: pwsh
        run: ./scripts/Lint.ps1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      # `php artisan test` also needs phpunit from require-dev.
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Run E2E smoke test
        run: php artisan test --filter=SmokeTest

  geo-eval:
    name: geo:eval (mock, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      # No GEMINI_API_KEY: the command fakes Gemini and writes a JSON report
      # that can be diffed between runs for regressions.
      - name: Run offline quality eval
        run: php artisan geo:eval --report=storage/app/eval-mock-ci.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: geo-eval-mock
          path: storage/app/eval-mock-ci.json

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json & composer.lock
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Security audit
        run: composer audit

  pint:
    name: Pint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Pint --test changed files
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- app routes config database tests)
          if [ -z "$CHANGED" ]; then
            echo "No PHP files changed — nothing to check."
            exit 0
          fi
          echo "Checking: $CHANGED"
          vendor/bin/pint --test $CHANGED

  dependabot-schema:
    name: Dependabot schema (check-jsonschema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check-jsonschema 0.39.0 (Apache-2.0, Python >=3.11) ships a vendored
      # SchemaStore dependabot schema as "vendor.dependabot"; both are
      # actively maintained upstream. Pinned so schema drift is visible.
      - name: Validate .github/dependabot.yml
        run: |
          python3 -m pip install --user 'check-jsonschema==0.39.0'
          python3 -m check_jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  larastan:
    name: Larastan (level 5, baseline ratchet)
    runs-on: ubuntu-latest
    # Larastan boots the Laravel console kernel. Without a .env the defaults
    # point at pgsql/database cache, which crashes bootstrap when pdo_pgsql
    # is absent. Pin hermetic, in-process drivers so analysis needs no .env.
    env:
      CACHE_STORE: array
      SESSION_DRIVER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php || '8.2' }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      # Existing debt is captured in phpstan-baseline.neon; any NEW level-5
      # error fails the job. Regenerate the baseline only with intent.
      # The explicit flag matches the composer analyse script and keeps
      # PHPStan off setup-php's default 128M limit.
      - name: Static analysis
        run: composer analyse -- --memory-limit=1G

  pgsql-upgrade:
    name: Postgres migration upgrade (origin/main -> PR)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tg
          POSTGRES_PASSWORD: tg
          POSTGRES_DB: tg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tg
      DB_USERNAME: tg
      DB_PASSWORD: tg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, gd, exif, pcntl, bcmath, pdo_pgsql
          coverage: none

      # origin/main first: prove the old schema migrates cleanly.
      - name: Create origin/main worktree
        run: git worktree add ../main-tree origin/main

      - name: Install origin/main dependencies
        working-directory: ../main-tree
        run: composer install --optimize-autoloader --no-interaction

      - name: Migrate origin/main schema
        working-directory: ../main-tree
        run: php artisan migrate --force

      # Then the PR commit: install, migrate on top, run everything on Postgres.
      - name: Install PR dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Migrate PR schema on top
        run: php artisan migrate --force

      # phpunit.pgsql.xml is phpunit.xml without the SQLite env overrides.
      - name: Full PHPUnit suite on Postgres
        run: vendor/bin/phpunit -c phpunit.pgsql.xml

  docker:
    name: Docker build + /api/health on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tg
          POSTGRES_PASSWORD: tg
          POSTGRES_DB: tg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Dockerfile
        run: docker build -t tracegeo-ci .

      # The production image installs with --no-dev. If league/iso3166 were
      # only a dev dependency, this would fail - it runs the app's own
      # country normaliser, not the library directly.
      - name: Production image includes ISO normalizer (require)
        run: |
          docker run --rm --entrypoint php tracegeo-ci -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $calculator = new App\Services\Gemini\ConfidenceCalculator(
              $app->make(App\Services\OpenStreetMapService::class)
          );
          $method = new ReflectionMethod($calculator, "countryCode");
          $method->setAccessible(true);
          $code = $method->invoke($calculator, "USA");
          echo "USA -> ", $code, PHP_EOL;
          exit($code === "us" ? 0 : 1);
          '

      - name: Start container
        run: |
          docker run -d --name tracegeo-ci --network host \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:8080 \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_DATABASE=tg \
            -e DB_USERNAME=tg \
            -e DB_PASSWORD=tg \
            -e CACHE_STORE=database \
            -e SESSION_DRIVER=database \
            -e QUEUE_CONNECTION=database \
            tracegeo-ci

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/api/health || true)
            if [ "$code" = "200" ]; then
              echo "health_http=200"
              exit 0
            fi
            sleep 5
          done
          docker logs tracegeo-ci || true
          echo "container never became healthy"
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs tracegeo-ci || true
