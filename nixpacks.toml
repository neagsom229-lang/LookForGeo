[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_sqlite", "php82Extensions.sqlite3", "php82Extensions.exif", "php82Extensions.gd"]

[phases.install]
cmds = ["composer install --ignore-platform-reqs"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader --ignore-platform-reqs"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT}"