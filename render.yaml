services:
  - type: web
    name: LookForGeo
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://lookforgeo.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      # This is CRITICAL: The queue worker inside Docker will read from the database!
      - key: QUEUE_CONNECTION
        value: database
      # retry_after must exceed the queue worker's --timeout=180 so a job is
      # never picked up twice while still running.
      - key: DB_QUEUE_RETRY_AFTER
        value: 240
      # One retry layer in GeminiClient: 30s per request, 90s total budget.
      - key: GEMINI_TIMEOUT
        value: 30
      - key: GEMINI_MAX_TOTAL_TIME
        value: 90
      - key: GEMINI_RETRIES
        value: 1
      # Cost guard: per-user daily quota + global kill switch (0 = off)
      - key: GEMINI_DAILY_PER_USER
        value: 50
      - key: GEMINI_DAILY_LIMIT
        value: 0
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      # Secret keys — set actual values in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_EMBED_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  - type: worker
    name: queue-worker
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader && chmod -R 775 storage bootstrap/cache && php artisan config:cache
    startCommand: php artisan queue:work --tries=1 --timeout=180 --sleep=1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        # Must match the web service: the queue worker invalidates dashboard
        # cache entries (GeoAnalysis model events) that the web process reads,
        # so both sides have to use the same store.
        # NOTE: the old key here was CACHE_DRIVER, which Laravel 11+ ignores
        # (config/cache.php reads CACHE_STORE only) -- see .env.example.
        value: database
      - key: SESSION_DRIVER
        # A queue worker never starts a session; kept only for parity with the
        # web service. Harmless but not load-bearing.
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: 240
      - key: GEMINI_TIMEOUT
        value: 30
      - key: GEMINI_MAX_TOTAL_TIME
        value: 90
      - key: GEMINI_RETRIES
        value: 1
      # Cost guard: per-user daily quota + global kill switch (0 = off)
      - key: GEMINI_DAILY_PER_USER
        value: 50
      - key: GEMINI_DAILY_LIMIT
        value: 0
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_EMBED_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false