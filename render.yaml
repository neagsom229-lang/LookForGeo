services:
  - type: web
    name: LookForGeo
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan migrate --force && php artisan storage:link
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://lookforgeo.onrender.com
      - key: DATABASE_URL
        value: postgresql://lookforgeo_db_user:6ZIAtzeEtNk0T0bevY4DPCvb6OS8B1OE@dpg-da3h4ogu01pc738n6ing-a:5432/lookforgeo_db
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      # ⚠️ REPLACE THE VALUES BELOW WITH YOUR ACTUAL KEYS
      - key: GEMINI_API_KEY
        value: your_actual_gemini_key
      - key: GOOGLE_MAPS_EMBED_KEY
        value: your_actual_google_maps_key
      - key: CLOUDINARY_URL
        value: cloudinary://189951824121921:rAj6ViiDqGd7oWKQsRQdMho6nLw/hyv3laps

  - type: worker
    name: queue-worker
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        value: postgresql://lookforgeo_db_user:6ZIAtzeEtNk0T0bevY4DPCvb6OS8B1OE@dpg-da3h4ogu01pc738n6ing-a:5432/lookforgeo_db
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      # ⚠️ REPLACE THE VALUES BELOW WITH YOUR ACTUAL KEYS (same as above)
      - key: GEMINI_API_KEY
        value: AQ.Ab8RN6L7ZbRFac-xaVyZtn66co8_u6OsG3jntfLxNMFVF-ekcg
      - key: GOOGLE_MAPS_EMBED_KEY
        value: AIzaSyBcxirNN0kk0hiMbbPM-wH7o9wRX5Y8MS8
      - key: CLOUDINARY_URL
        value: cloudinary://189951824121921:rAj6ViiDqGd7oWKQsRQdMho6nLw/hyv3laps