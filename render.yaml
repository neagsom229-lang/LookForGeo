services:
  - type: web
    name: LookForGeo
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TraceGeo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://lookforgeo.onrender.com
      - key: SESSION_COOKIE
        value: tracegeo_session
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      # This is CRITICAL: The queue worker inside Docker will read from the database!
      - key: QUEUE_CONNECTION
        value: database
      # retry_after must exceed the queue worker's --timeout=180 so a job is
      # never picked up twice while still running.
      - key: DB_QUEUE_RETRY_AFTER
        value: 240
      # One retry layer in GeminiClient: 50s per request, 110s total budget.
      - key: GEMINI_TIMEOUT
        value: 50
      - key: GEMINI_TOTAL_BUDGET
        value: 110
      - key: GEMINI_RETRIES
        value: 1
      # Circuit breaker for quota/overload failures (shared cache state)
      - key: GEMINI_CIRCUIT_FAILURES
        value: 3
      - key: GEMINI_CIRCUIT_OPEN_SECONDS
        value: 100
      # Cost guard: per-user daily quota + global kill switch (0 = off)
      - key: GEMINI_DAILY_PER_USER
        value: 50
      - key: GEMINI_DAILY_LIMIT
        value: 0
      # Reap-on-read window (no Render scheduler needed). Must stay above the
      # browser's 20-minute AI wait so a watched job is never reaped early.
      - key: ANALYSIS_REAP_MINUTES
        value: 25
      # Stale pending row cutoff, based on updated_at; >= 980s worst case + margin.
      - key: ANALYSIS_STALE_PENDING_SECONDS
        value: 1200
      - key: GEMINI_CONFIDENCE_REVERSE_GEOCODE
        value: true
      - key: GEMINI_HEALTH_PROBE
        value: false
      - key: HEALTH_ADMIN_TOKEN
        sync: false
      - key: NOMINATIM_CONTACT
        sync: false
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_HEDGE_AFTER
        value: 18
      - key: GEMINI_TIMEOUT_OVERRIDES
        value: ""
      - key: GEMINI_THINKING_OVERRIDES
        value: ""
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      # Optional escalation: empty = off
      - key: GEMINI_ESCALATION_MODEL
        value: ""
      - key: GEMINI_ESCALATE_BELOW
        value: 100
      - key: GEMINI_ESCALATION_TIMEOUT
        value: 25
      # Secret keys â€” set actual values in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_EMBED_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
