; ============================================================
; TRACEGEO - PRODUCTION PHP CONFIGURATION (Clean)
; ============================================================

; ============================================================
; EXTENSIONS (Only load what is NOT already loaded)
; ============================================================

; GD is already loaded by default – do NOT load it again
; extension=gd
; extension=gd2  <-- THIS DOES NOT EXIST, REMOVE

; EXIF is already loaded – remove duplicate
; extension=exif

; PostgreSQL drivers are already loaded – remove duplicates
; extension=pdo_pgsql
; extension=pgsql

; ============================================================
; RESOURCE LIMITS
; ============================================================
max_execution_time = 180
max_input_time = 180
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; ============================================================
; ERROR REPORTING (Production)
; ============================================================
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

; ============================================================
; FILE UPLOADS & STORAGE
; ============================================================
file_uploads = On
upload_tmp_dir = /tmp
session.save_path = /tmp

; ============================================================
; PERFORMANCE OPTIMIZATIONS
; ============================================================
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ============================================================
; SESSION & COOKIE SECURITY
; ============================================================
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1

; ============================================================
; DATE & TIME
; ============================================================
date.timezone = UTC

; ============================================================
; DEFAULT MIME TYPE
; ============================================================
default_mimetype = "text/html"

; ============================================================
; SECURITY
; ============================================================
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source