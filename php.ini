; ============================================================
; TRACEGEO - PRODUCTION PHP CONFIGURATION
; Optimized for Render + Laravel + AI Processing
; ============================================================

; ============================================================
; EXTENSIONS
; ============================================================

; Image processing
extension=gd
extension=gd2

; EXIF metadata extraction
extension=exif

; Database drivers
extension=pdo_pgsql
extension=pgsql

; ============================================================
; RESOURCE LIMITS
; ============================================================

; PHP execution time (AI analysis can take 60+ seconds)
max_execution_time = 180
max_input_time = 180
memory_limit = 512M

; File upload limits
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20

; ============================================================
; ERROR REPORTING (Production - OFF by default)
; ============================================================

; Turn OFF for production (ONLY enable temporarily for debugging)
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /dev/stderr

; ============================================================
; FILE UPLOADS & STORAGE
; ============================================================

file_uploads = On
upload_tmp_dir = /tmp
session.save_path = /tmp

; ============================================================
; PERFORMANCE OPTIMIZATIONS
; ============================================================

; Enable OPcache for faster PHP execution
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1

; Realpath cache for faster file system lookups
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ============================================================
; SESSION & COOKIE SECURITY
; ============================================================

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1

; ============================================================
; DATE & TIME
; ============================================================

date.timezone = UTC

; ============================================================
; DEFAULT MIME TYPE
; ============================================================

default_mimetype = "text/html"

; ============================================================
; LIMIT REQUEST BODY (Prevents DoS)
; ============================================================

; Limit to 64MB (matches upload limits)
; This is handled by post_max_size above

; ============================================================
; DISABLE DANGEROUS FUNCTIONS (Security)
; ============================================================

disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source