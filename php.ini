; ============================================================
; TraceGeo - Custom PHP Configuration
; ============================================================

; ============================================================
; EXTENSIONS
; ============================================================

; Enable GD for image processing
extension=gd
extension=gd2

; Enable EXIF for metadata extraction
extension=exif

; ============================================================
; RESOURCE LIMITS
; ============================================================

; Increase time limits for AI analysis
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Increase upload limits
post_max_size = 64M
upload_max_filesize = 64M

; ============================================================
; ERROR REPORTING
; ============================================================

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; ============================================================
; SESSION
; ============================================================

session.save_path = "storage/framework/sessions"

; ============================================================
; FILE UPLOADS
; ============================================================

file_uploads = On
upload_tmp_dir = "storage/tmp"