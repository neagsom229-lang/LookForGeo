; ============================================================
; RESOURCE LIMITS
; ============================================================
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M

; ============================================================
; ERROR REPORTING (Turn OFF on live production!)
; ============================================================
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; ============================================================
; FILE UPLOADS & STORAGE (Critical fix for Render)
; ============================================================
file_uploads = On
upload_tmp_dir = /tmp
session.save_path = /tmp